<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdfbf7">
<title>Select</title>

<!-- PWA Manifest & Meta Tags -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Select">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%238c6d53%22/><text x=%2250%%22 y=%2254%%22 font-size=%2250%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22>🎲</text></svg>">
<link rel="manifest" id="manifestPlaceholder">

<style>
:root{
  --bg: #fdfbf7;
  --card: #ffffff;
  --text: #3c3530;
  --muted: #8c8279;
  --line: #e6dfd5;
  --accent: #8c6d53;
  --soft: #f4efe9;
  --danger: #b85c5c;
  --dangerbg: #fae8e8;
  --shadow: 0 14px 40px rgba(80, 65, 50, 0.06);
  --r: 22px;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:900px;margin:auto;padding:22px 16px 50px}
header{margin:6px 0 18px;display:flex;justify-content:space-between;align-items:center}h1{font-size:29px;letter-spacing:-1.6px;margin:0 0 6px;font-weight:900}.sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}h2{font-size:17px;margin:0 0 15px}
.topbar{display:flex;gap:9px;flex-wrap:wrap}.select,.input{height:48px;border:1px solid #dcd3c7;border-radius:14px;background:#fff;padding:0 13px;outline:0;color:var(--text)}.select:focus,.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8c6d531a}.set-select{flex:1;min-width:190px}.btn{min-height:44px;padding:0 15px;border:0;border-radius:13px;background:#f4efe9;color:#4a4038;font-weight:800}.btn.primary{background:var(--accent);color:#fff}.btn.danger{background:var(--dangerbg);color:var(--danger)}.btn:disabled{opacity:.5;cursor:not-allowed}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{padding:18px;border:1.5px solid var(--line);border-radius:18px;background:#fff;text-align:left}.mode.active{border-color:var(--accent);background:var(--soft)}.mode .title{font-weight:900}.mode .desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.big-result{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,#fff,#faf7f2);border-radius:20px;border:1px solid var(--line)}.result-label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:9px}.result-text{font-size:36px;font-weight:950;letter-spacing:-1.8px;padding:0 18px}.result-sub{font-size:13px;color:var(--muted);margin-top:9px}.count{font-size:90px;color:var(--accent);font-weight:950}
.main-actions{display:flex;gap:9px;margin-top:13px}.main-actions .btn{flex:1;height:52px}.status{text-align:center;font-size:12px;color:var(--muted);min-height:18px;margin-top:11px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#fff;display:flex;justify-content:space-between;gap:8px}.item.removed{background:#f4f0eb;color:#b0a499;text-decoration:line-through}.name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.state{font-size:11px;font-weight:800;color:var(--accent)}.counter{font-size:12px;color:var(--muted);font-weight:800}
.modal-back{position:fixed;inset:0;background:#3c353066;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal-back.show{display:flex}.modal{width:min(620px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 25px 80px rgba(80,65,50,0.2)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-title{font-size:20px;font-weight:900}.manage-row{display:flex;gap:8px;margin-bottom:10px}.manage-row .input{flex:1}.set-card{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:8px}.set-name{font-weight:850}.set-count{font-size:11px;color:var(--muted);margin-top:3px}.set-actions{display:flex;gap:6px}.small{min-height:40px;padding:0 11px;border:0;border-radius:11px;background:#f4efe9;font-weight:800;color:#5a4e44}.edit-list{display:flex;flex-direction:column;gap:8px}.edit-item{display:grid;grid-template-columns:1fr auto;gap:7px}.empty{text-align:center;padding:30px;color:var(--muted);background:#f9f6f2;border-radius:16px}
#installBtn{display:none}
.hero-card{padding:16px;background:linear-gradient(145deg,#fff,#f8f2ea);border-color:#ddd1c2}
.hero-meta{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{font-size:11px;font-weight:850;color:var(--accent);background:#fff;border:1px solid #e4d9cd;border-radius:999px;padding:6px 9px}
.hero-card .big-result{min-height:185px;border:0;background:transparent}.hero-card .main-actions .btn.primary{height:58px;font-size:17px;box-shadow:0 9px 22px rgba(140,109,83,.18)}
.segment{display:grid;grid-template-columns:1fr 1fr;padding:5px;background:var(--soft);border:1px solid var(--line);border-radius:16px;gap:5px}.segment .mode{padding:12px 14px;border:0;border-radius:12px;background:transparent;text-align:center}.segment .mode.active{background:#fff;box-shadow:0 4px 14px rgba(80,65,50,.08);color:var(--accent)}.segment .mode .desc{display:none}.mode-help{font-size:12px;color:var(--muted);text-align:center;margin-top:9px}
.compact-card{padding:15px 17px}.compact-card h2{font-size:14px;margin-bottom:10px;color:var(--muted)}.compact-card .topbar{align-items:center}.compact-card .select{height:44px}
.items-card{padding:15px 17px}.items-card h2{font-size:14px;margin-bottom:10px}.items{gap:7px}.item{padding:10px 12px;border-radius:12px;font-size:13px}
.backup-card{padding:15px 17px}.backup-row{display:flex;gap:8px;flex-wrap:wrap}.backup-row .btn{flex:1;min-width:150px}.backup-note{font-size:11px;color:var(--muted);line-height:1.55;margin-top:9px}
@media(max-width:620px){.app{padding:15px 12px 36px}h1{font-size:25px}.card{padding:16px}.mode-grid,.items{grid-template-columns:1fr}.topbar{display:grid;grid-template-columns:1fr 1fr}.set-select{grid-column:1/-1}.main-actions{flex-direction:column}.set-card{align-items:flex-start;flex-direction:column}.set-actions{width:100%}.set-actions .small{flex:1}.result-text{font-size:29px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>Select</h1></div>
  <button class="btn primary" id="installBtn">📱 앱 설치</button>
</header>

<section class="card hero-card">
<div class="hero-meta"><span class="chip" id="heroSet">세트</span><span class="chip" id="heroMode">🎲 랜덤 선택</span></div>
<div class="big-result">
<div class="result-label" id="resultLabel">오늘의 결정</div>
<div class="result-text" id="resultText">결정이 필요하신가요?</div>
<div class="result-sub" id="resultSub">고민은 여기까지.</div>
</div>
<div class="main-actions">
<button class="btn primary" id="pickBtn">🎲 선택하기</button>
<button class="btn" id="resetRemoved" style="display:none">↺ 제거 항목 초기화</button>
</div>
<div class="status" id="status"></div>
</section>

<section class="card compact-card">
<h2>선택 방식</h2>
<div class="segment">
<button class="mode active" id="modeRandom"><div class="title">🎲 랜덤 선택</div><div class="desc">전체 항목에서 매번 무작위로 선택합니다.</div></button>
<button class="mode" id="modeRemove"><div class="title">✂️ 하나씩 제거</div><div class="desc">뽑힌 항목을 제거하고 마지막 1개까지 이어갑니다.</div></button>
</div>
<div class="mode-help" id="modeHelp">전체 항목에서 매번 무작위로 하나를 고릅니다.</div>
</section>

<section class="card compact-card">
<h2>선택 세트</h2>
<div class="topbar">
<select id="setSelect" class="select set-select"></select>
<button class="btn" id="manageSets">세트 관리</button>
<button class="btn primary" id="newSet">＋ 새 세트</button>
</div>
</section>

<section class="card items-card">
<h2>현재 항목 <span id="itemCount" class="counter"></span></h2>
<div id="items" class="items"></div>
</section>

<section class="card backup-card">
<h2>프리셋 백업</h2>
<div class="backup-row">
<button class="btn" id="exportBackup">⇩ 프리셋 내보내기</button>
<button class="btn" id="importBackup">⇧ 프리셋 가져오기</button>
<input type="file" id="importFile" accept="application/json,.json" hidden>
</div>
<div class="backup-note">선택 세트와 항목, 선택 방식만 JSON 파일로 저장합니다. 다른 기기에서 가져오면 현재 프리셋을 백업 파일의 내용으로 교체합니다.</div>
</section>
</div>

<div class="modal-back" id="modalBack">
<div class="modal">
<div class="modal-head"><div class="modal-title" id="modalTitle"></div><button class="btn" id="closeModal">닫기</button></div>
<div id="modalBody"></div>
</div>
</div>

<script>
(function(){
"use strict";

const manifestData = {
  name: "Select Picker",
  short_name: "Select",
  start_url: window.location.pathname,
  display: "standalone",
  background_color: "#fdfbf7",
  theme_color: "#fdfbf7",
  icons: [
    {
      src: "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%22110%22 fill=%22%238c6d53%22/><text x=%2250%%22 y=%2254%%22 font-size=%22260%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22>🎲</text></svg>",
      sizes: "512x512",
      type: "image/svg+xml"
    }
  ]
};
const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
document.getElementById('manifestPlaceholder').href = URL.createObjectURL(blob);

if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => { self.skipWaiting(); });
    self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
    self.addEventListener('fetch', e => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
  `;
  const swBlob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration failed:', err));
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const installBtn = document.getElementById('installBtn');
  if(installBtn) installBtn.style.display = 'block';
});

document.getElementById('installBtn')?.addEventListener('click', async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if(outcome === 'accepted') {
    document.getElementById('installBtn').style.display = 'none';
  }
  deferredPrompt = null;
});

const KEY="select_picker_v5";
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

let db;
try{db=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){db=null}
if(!db || !Array.isArray(db.sets) || !db.sets.length){
  const first={id:uid(),name:"A세트",items:["카페 가기","도서관 가기","운동장 가기"],removed:[]};
  db={sets:[first],active:first.id,mode:"random"};
}
if(!db.sets.some(s=>s.id===db.active)) db.active=db.sets[0].id;
if(!db.mode) db.mode="random";

let mode=db.mode;
let busy=false;

function save(){
  db.mode=mode;
  try{localStorage.setItem(KEY,JSON.stringify(db))}
  catch(e){alert("브라우저 저장 기능을 사용할 수 없습니다.")}
}
function active(){return db.sets.find(s=>s.id===db.active)||db.sets[0]}

function getRemovedSet(){
  const s=active();
  if(!s.removed) s.removed=[];
  return new Set(s.removed);
}

function setRemovedSet(remSet){
  const s=active();
  s.removed=Array.from(remSet);
  save();
}

function resetResult(){
  if(mode!=="remove"){
    setRemovedSet(new Set());
  }
  $("resultLabel").textContent="오늘의 결정";
  $("resultText").textContent="결정이 필요하신가요?";
  $("resultSub").textContent="고민은 여기까지.";
  $("status").textContent="";
}

function render(){
  const s=active();
  const rem=getRemovedSet();

  $("setSelect").innerHTML=db.sets.map(x=>
    '<option value="'+esc(x.id)+'">'+esc(x.name)+" · "+x.items.length+"개</option>"
  ).join("");
  $("setSelect").value=s.id;
  $("heroSet").textContent=s.name+" · "+s.items.length+"개";
  $("heroMode").textContent=mode==="remove"?"✂️ 하나씩 제거":"🎲 랜덤 선택";
  $("modeHelp").textContent=mode==="remove"?"뽑힌 항목을 하나씩 제외해 마지막 1개까지 좁힙니다.":"전체 항목에서 매번 무작위로 하나를 고릅니다.";

  const alive=s.items.map((_,i)=>i).filter(i=>!rem.has(i));
  $("itemCount").textContent=(mode==="remove"?"남은 "+alive.length+"개 · ":"")+"전체 "+s.items.length+"개";

  $("items").innerHTML=s.items.length
    ? s.items.map((x,i)=>'<div class="item '+(rem.has(i)?"removed":"")+'"><span class="name">'+esc(x)+'</span><span class="state">'+(rem.has(i)?"제거됨":"")+"</span></div>").join("")
    : '<div class="empty" style="grid-column:1/-1">이 세트에는 항목이 없습니다.</div>';

  $("resetRemoved").style.display=(mode==="remove" && rem.size)?"block":"none";
  $("pickBtn").textContent="🎲 선택하기";
  $("modeRandom").classList.toggle("active",mode==="random");
  $("modeRemove").classList.toggle("active",mode==="remove");
}

function setMode(m){
  if(busy)return;
  mode=m;
  if(mode!=="remove"){
    setRemovedSet(new Set());
  }
  resetResult();
  save();
  render();
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function pick(){
  if(busy)return;
  const s=active();
  const rem=getRemovedSet();
  const pool=s.items.map((_,i)=>i).filter(i=>mode==="random" || !rem.has(i));

  if(!pool.length){
    $("status").textContent="선택할 항목이 없습니다.";
    return;
  }

  busy=true;
  $("pickBtn").disabled=true;

  for(const n of [3,2,1]){
    $("resultLabel").textContent="선택 중";
    $("resultText").textContent=n;
    $("resultSub").textContent="";
    await sleep(700);
  }

  const index=pool[Math.floor(Math.random()*pool.length)];
  $("resultLabel").textContent="결정 완료";
  $("resultText").textContent=s.items[index];

  if(mode==="remove"){
    rem.add(index);
    setRemovedSet(rem);
    $("resultSub").textContent="이 선택지는 제외했습니다. 계속 좁혀볼까요?";
  }else{
    $("resultSub").textContent="결정 완료. 고민 끝.";
  }

  render();
  if(mode==="remove" && s.items.length-rem.size===1)
    $("status").textContent="이제 마지막 1개가 남았습니다.";

  busy=false;
  $("pickBtn").disabled=false;
}

function closeModal(){$("modalBack").classList.remove("show")}
function openModal(title,body){
  $("modalTitle").textContent=title;
  $("modalBody").innerHTML=body;
  $("modalBack").classList.add("show");
}

function newSet(){
  openModal("새 세트 만들기",
    '<div class="manage-row">'+
    '<input id="createName" class="input" placeholder="예: 주말 선택지">'+
    '<button class="btn primary" id="createNow">만들기</button>'+
    '</div>');
  const input=$("createName");
  const create=()=>{
    const name=input.value.trim();
    if(!name){input.focus();return}
    const s={id:uid(),name,items:[],removed:[]};
    db.sets.push(s);
    db.active=s.id;
    save();
    mode="random";
    render();
    closeModal();
    openItems(s.id);
  };
  $("createNow").onclick=create;
  input.onkeydown=e=>{if(e.key==="Enter")create()};
  setTimeout(()=>input.focus(),30);
}

function openSets(){
  openModal("세트 관리",
    '<div class="manage-row">'+
    '<input id="newSetName" class="input" placeholder="새 세트 이름">'+
    '<button class="btn primary" id="createSet">추가</button>'+
    '</div>'+
    '<div id="setList"></div>');
  renderSetList();

  const input=$("newSetName");
  const add=()=>{
    const name=input.value.trim();
    if(!name){input.focus();return}
    const s={id:uid(),name,items:[],removed:[]};
    db.sets.push(s);
    db.active=s.id;
    save();
    mode="random";
    render();
    closeModal();
    openItems(s.id);
  };
  $("createSet").onclick=add;
  input.onkeydown=e=>{if(e.key==="Enter")add()};
}

function renderSetList(){
  const list=$("setList");
  if(!list)return;
  list.innerHTML=db.sets.map(s=>
    '<div class="set-card">'+
      '<div><div class="set-name">'+esc(s.name)+'</div><div class="set-count">'+s.items.length+"개 항목</div></div>"+
      '<div class="set-actions">'+
        '<button class="small" data-action="load" data-id="'+esc(s.id)+'">불러오기</button>'+
        '<button class="small" data-action="items" data-id="'+esc(s.id)+'">항목 편집</button>'+
        '<button class="small" data-action="rename" data-id="'+esc(s.id)+'">이름</button>'+
        '<button class="small" data-action="delete" data-id="'+esc(s.id)+'">삭제</button>'+
      '</div>'+
    '</div>'
  ).join("");
}

function openItems(id){
  const s=db.sets.find(x=>x.id===id);
  if(!s)return;

  openModal("항목 편집",
    '<div class="manage-row">'+
      '<input id="newItem" class="input" placeholder="새 선택 항목">'+
      '<button class="btn primary" id="addItem">추가</button>'+
    '</div>'+
    '<div id="editList"></div>'
  );
  renderEditList(id);

  const input=$("newItem");
  const add=()=>{
    const value=input.value.trim();
    if(!value){input.focus();return}
    s.items.push(value);
    s.removed=[];
    save();
    input.value="";
    render();
    renderEditList(id);
    input.focus();
  };
  $("addItem").onclick=add;
  input.onkeydown=e=>{if(e.key==="Enter")add()};
}

function renderEditList(id){
  const s=db.sets.find(x=>x.id===id);
  const list=$("editList");
  if(!s||!list)return;

  list.innerHTML=s.items.length
    ? s.items.map((x,i)=>
      '<div class="edit-item">'+
        '<input class="input edit-name" data-i="'+i+'" value="'+esc(x)+'">'+
        '<button class="small" data-del-item="'+i+'">×</button>'+
      '</div>'
    ).join("")
    : '<div class="empty">아직 항목이 없습니다.</div>';

  list.querySelectorAll(".edit-name").forEach(input=>{
    input.onchange=()=>{
      const i=Number(input.dataset.i);
      const value=input.value.trim();
      if(value)s.items[i]=value;
      save();render();
    };
  });

  list.querySelectorAll("[data-del-item]").forEach(btn=>{
    btn.onclick=()=>{
      s.items.splice(Number(btn.dataset.delItem),1);
      s.removed=[];
      save();render();renderEditList(id);
    };
  });
}

function exportBackup(){
  const payload={
    app:"Select",
    version:1,
    exportedAt:new Date().toISOString(),
    presets:{sets:db.sets,active:db.active,mode:mode}
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,10).replaceAll("-","");
  a.href=url;a.download="Select_presets_"+stamp+".json";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  $("status").textContent="프리셋 백업 파일을 만들었습니다.";
}

function importBackupFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      const p=data && data.presets;
      if(!p || !Array.isArray(p.sets) || !p.sets.length) throw new Error("invalid");
      const cleanSets=p.sets.map(s=>({
        id:String(s.id||uid()),
        name:String(s.name||"이름 없는 세트"),
        items:Array.isArray(s.items)?s.items.map(x=>String(x)):[],
        removed:[]
      }));
      if(!confirm("현재 프리셋을 백업 파일의 내용으로 교체할까요?"))return;
      db.sets=cleanSets;
      db.active=cleanSets.some(s=>s.id===p.active)?p.active:cleanSets[0].id;
      mode=p.mode==="remove"?"remove":"random";
      save();resetResult();render();
      $("status").textContent="프리셋을 가져왔습니다.";
    }catch(e){alert("올바른 Select 프리셋 백업 파일이 아닙니다.");}
    $("importFile").value="";
  };
  reader.readAsText(file);
}

$("exportBackup").onclick=exportBackup;
$("importBackup").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>importBackupFile(e.target.files[0]);

$("setSelect").onchange=e=>{
  db.active=e.target.value;
  resetResult();
  save();render();
};

$("modeRandom").onclick=()=>setMode("random");
$("modeRemove").onclick=()=>setMode("remove");
$("pickBtn").onclick=pick;

$("resetRemoved").onclick=()=>{
  setRemovedSet(new Set());
  resetResult();
  render();
  $("status").textContent="제거된 항목을 모두 되돌렸습니다.";
};

$("manageSets").onclick=openSets;
$("newSet").onclick=newSet;
$("closeModal").onclick=closeModal;
$("modalBack").onclick=e=>{if(e.target===$("modalBack"))closeModal()};

$("modalBody").addEventListener("click",e=>{
  const btn=e.target.closest("button[data-action]");
  if(!btn)return;

  const id=btn.dataset.id;
  const s=db.sets.find(x=>x.id===id);
  if(!s)return;

  if(btn.dataset.action==="load"){
    db.active=id;
    resetResult();
    save();render();closeModal();
  }

  if(btn.dataset.action==="items")openItems(id);

  if(btn.dataset.action==="rename"){
    const name=prompt("세트 이름을 수정하세요.",s.name);
    if(name!==null && name.trim()){
      s.name=name.trim();
      save();render();renderSetList();
    }
  }

  if(btn.dataset.action==="delete"){
    if(db.sets.length<=1){
      alert("세트가 하나뿐이라 삭제할 수 없습니다.");
      return;
    }
    if(confirm('"'+s.name+'" 세트를 삭제할까요?')){
      db.sets=db.sets.filter(x=>x.id!==id);
      if(db.active===id)db.active=db.sets[0].id;
      save();render();renderSetList();
    }
  }
});

render();
})();
</script>
</body>
</html>
