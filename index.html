<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4ead8">
<title>Q & A</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="On It">
<style>
  :root{
    --bg:#f3eadb;
    --paper:#fffaf0;
    --paper2:#f8f0e3;
    --ink:#3f342b;
    --muted:#88786a;
    --line:#ded0bd;
    --accent:#c96f52;
    --accent-dark:#a9573e;
    --soft:#ead9c3;
    --shadow:0 14px 35px rgba(77,55,35,.10);
    --radius:22px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg)}
  body{overflow-x:hidden}
  button,input,textarea{font:inherit}
  button{cursor:pointer}
  .app{min-height:100vh;display:flex}
  .sidebar{
    width:260px;padding:28px 18px 20px;border-right:1px solid rgba(92,69,48,.13);
    background:rgba(255,250,240,.55);backdrop-filter:blur(12px);display:flex;flex-direction:column;
  }
  .brand{padding:4px 12px 24px}
  .brand-title{font-family:Georgia,"Times New Roman",serif;font-size:31px;font-weight:700;letter-spacing:-1px}
  .brand-sub{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.5}
  .nav{display:grid;gap:7px}
  .nav button,.mobile-nav button{
    border:0;background:transparent;color:var(--ink);text-align:left;padding:13px 14px;border-radius:14px;
    transition:.18s ease;font-weight:650
  }
  .nav button:hover,.mobile-nav button:hover{background:rgba(234,217,195,.6)}
  .nav button.active{background:var(--ink);color:#fffaf0}
  .side-bottom{margin-top:auto;padding:14px 12px 0;color:var(--muted);font-size:11px;line-height:1.6}
  .main{flex:1;min-width:0}
  .topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 34px}
  .mobile-menu{display:none}
  .mobile-tabs{display:none}
  .view{max-width:980px;margin:0 auto;padding:22px 34px 60px}
  .hero{margin:20px 0 28px}
  .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent-dark);font-weight:800;text-transform:uppercase}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:42px;line-height:1.15;margin:8px 0 8px;letter-spacing:-1.5px}
  .intro{color:var(--muted);margin:0;line-height:1.7}
  .question-card{
    position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:34px 52px 30px;box-shadow:var(--shadow);height:420px;display:flex;flex-direction:column;
    overflow:hidden;
  }
  .question-card:before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
    background-image:linear-gradient(rgba(118,86,55,.08) 1px,transparent 1px);background-size:100% 34px;
  }
  .card-inner{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;min-height:0}
  .question-area{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:auto;padding:8px 0}
  .category-pill{
    display:inline-flex;align-items:center;gap:7px;background:var(--soft);color:var(--accent-dark);
    border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800
  }
  .question{
    font-family:Georgia,"Noto Serif KR",serif;font-size:31px;line-height:1.55;letter-spacing:-.7px;
    margin:25px 0 32px;word-break:keep-all
  }
  .card-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:0 0 auto;margin-top:14px}
  .heart{
    width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:#fffdf7;
    color:var(--muted);font-size:22px;display:grid;place-items:center;transition:.18s ease
  }
  .heart:hover{transform:translateY(-2px);border-color:var(--accent)}
  .heart.fav{color:var(--accent);border-color:#e2aa98;background:#fff0e9}
  .primary{
    border:0;border-radius:14px;padding:12px 17px;background:var(--ink);color:#fffaf0;font-weight:800;
    transition:.18s ease
  }
  .primary:hover{transform:translateY(-1px);background:#2f2822}
  .secondary{
    border:1px solid var(--line);border-radius:14px;padding:11px 15px;background:var(--paper);color:var(--ink);font-weight:700
  }
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}
  .chip{
    border:1px solid var(--line);background:rgba(255,250,240,.7);color:var(--ink);padding:9px 13px;border-radius:999px;
    font-size:13px;font-weight:700
  }
  .chip:hover{border-color:var(--accent)}
  .panel{background:rgba(255,250,240,.72);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 25px rgba(77,55,35,.05)}
  .panel-title{font-weight:850;font-size:18px;margin-bottom:14px}
  .category-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .cat-card{border:1px solid var(--line);background:var(--paper);border-radius:17px;padding:18px;text-align:left}
  .cat-card strong{display:block;font-size:16px;margin-bottom:5px}
  .cat-card span{color:var(--muted);font-size:12px}
  .list{display:grid;gap:10px}
  .item{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:15px}
  .item-main{flex:1;min-width:0}
  .item-cat{font-size:11px;color:var(--accent-dark);font-weight:850;margin-bottom:5px}
  .item-text{line-height:1.55;word-break:keep-all}
  .item-actions{display:flex;gap:6px}
  .icon-btn{border:1px solid var(--line);background:#fffdf7;border-radius:10px;padding:7px 9px;color:var(--muted)}
  .empty{text-align:center;padding:45px 20px;color:var(--muted)}
  .form-grid{display:grid;gap:14px}
  label{font-size:12px;font-weight:850;color:var(--muted)}
  select,input,textarea{
    width:100%;border:1px solid var(--line);border-radius:12px;background:#fffdf7;color:var(--ink);padding:12px 13px;outline:none
  }
  textarea{min-height:110px;resize:vertical;line-height:1.55}
  select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,111,82,.12)}
  .form-row{display:grid;grid-template-columns:1fr auto;gap:10px}
  .category-row{display:flex;gap:8px;align-items:center;margin-top:10px}
  .category-row input{flex:1}
  .small{font-size:11px;color:var(--muted)}
  .hidden{display:none!important}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:var(--ink);color:#fffaf0;padding:11px 15px;border-radius:12px;font-size:13px;transition:.2s;z-index:50
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:760px){
    .app{display:block}
    .sidebar{display:none}
    .topbar{height:auto;min-height:58px;padding:8px 12px;border-bottom:1px solid rgba(92,69,48,.12);position:sticky;top:0;z-index:40;background:rgba(243,234,219,.94);backdrop-filter:blur(12px)}
    .mobile-menu{display:none}
  .mobile-tabs{display:none}
    .mobile-tabs{display:flex;width:100%;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none}
    .mobile-tabs::-webkit-scrollbar{display:none}
    .mobile-tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:11px;font-size:12px;font-weight:800;white-space:nowrap}
    .mobile-tabs button.active{background:var(--ink);color:#fffaf0}
    .mobile-brand{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:800;margin-right:3px;white-space:nowrap}
    .view{padding:18px 16px 45px}
    h1{font-size:32px}
    .hero{margin-top:10px}
    .question-card{padding:24px 23px 20px;height:390px}
    .question{font-size:25px;line-height:1.55;margin:22px 0 28px}
    .card-actions{align-items:flex-end}
    .toolbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
    .toolbar::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;white-space:nowrap}
    .category-grid{grid-template-columns:1fr 1fr}
  }
  @media(max-width:430px){
    .category-grid{grid-template-columns:1fr}
    .question-card{height:370px}
    .question{font-size:23px}
  }
</style>
<script>
// 동적 Blob URL을 활용한 Manifest 주입 (모바일 크롬 PWA 설치 지원)
(function() {
  const manifestData = {
    "name": "Q & A",
    "short_name": "Q&A",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#f3eadb",
    "theme_color": "#f4ead8",
    "icons": [
      {
        "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23c96f52%22/><text x=%2250%%22 y=%2254%%22 font-size=%2250%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 fill=%22%23fffaf0%22>Q</text></svg>",
        "sizes": "192x192",
        "type": "image/svg+xml"
      }
    ]
  };
  const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/manifest+json'});
  const manifestURL = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.currentScript.parentNode.appendChild(link);
})();
</script>

<script>
// PWA Service Worker 등록
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => e.waitUntil(clients.claim()));
      self.addEventListener('fetch', e => {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      });
    `;
    const blob = new Blob([swCode], {type: 'text/javascript'});
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl)
      .then(reg => console.log('ServiceWorker registered!', reg))
      .catch(err => console.log('ServiceWorker registration failed: ', err));
  });
}

const LS_Q="onit_questions_v1";
const LS_C="onit_categories_v1";
const LS_F="onit_favorites_v1";

let categories = loadCategories();
let questions = loadQuestions();
let favorites = new Set(JSON.parse(localStorage.getItem(LS_F)||"[]"));
let currentQuestionId = null;
let currentView = "random";

function loadCategories(){
  try{
    const saved=JSON.parse(localStorage.getItem(LS_C));
    return Array.isArray(saved)&&saved.length ? saved : structuredClone(DEFAULT_CATEGORIES);
  }catch(e){return structuredClone(DEFAULT_CATEGORIES)}
}
function loadQuestions(){
  try{
    const saved=JSON.parse(localStorage.getItem(LS_Q));
    return Array.isArray(saved)&&saved.length ? saved : QUESTIONS;
  }catch(e){return QUESTIONS}
}
function save(){
  localStorage.setItem(LS_Q,JSON.stringify(questions));
  localStorage.setItem(LS_C,JSON.stringify(categories));
  localStorage.setItem(LS_F,JSON.stringify([...favorites]));
}
function catName(id){return categories.find(c=>c.id===id)?.name || "미분류"}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function randomFrom(arr){return arr.length?arr[Math.floor(Math.random()*arr.length)]:null}
function toast(msg){
  const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),1800);
}
function updateNav(){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView));
  document.querySelectorAll("[data-mobile-view]").forEach(b=>b.classList.toggle("active",b.dataset.mobileView===currentView));
  document.getElementById("favCountNav").textContent=favorites.size?`(${favorites.size})`:"";
  const mobileCount=document.getElementById("favCountMobile");
  if(mobileCount) mobileCount.textContent=favorites.size?`(${favorites.size})`:"";
}
function setView(v){
  currentView=v;updateNav();
  if(v==="random") renderRandom();
  if(v==="categories") renderCategories();
  if(v==="favorites") renderFavorites();
  if(v==="manage") renderManage();
}
function renderRandom(){
  const q = currentQuestionId ? questions.find(x=>x.id===currentQuestionId) : null;
  const chosen=q || randomFrom(questions);
  if(!chosen){ document.getElementById("view").innerHTML=`<div class="empty">질문이 없습니다. 질문 관리에서 추가해 주세요.</div>`;return; }
  currentQuestionId=chosen.id;
  const isFav=favorites.has(chosen.id);
  document.getElementById("view").innerHTML=`
    <div class="hero">
      <div class="eyebrow">Random Question</div>
      <h1>질문</h1>
      <p class="intro">랜덤 질문 뽑기</p>
    </div>
    <div class="question-card">
      <div class="card-inner">
        <div class="question-area">
          <span class="category-pill">${escapeHtml(catName(chosen.categoryId))}</span>
          <div class="question">${escapeHtml(chosen.text)}</div>
        </div>
        <div class="card-actions">
          <button class="heart ${isFav?"fav":""}" id="heartBtn" aria-label="즐겨찾기">${isFav?"♥":"♡"}</button>
          <button class="primary" id="randomBtn">🎲 다른 질문</button>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <button class="chip" data-cat="all">전체 질문</button>
      ${categories.map(c=>`<button class="chip" data-cat="${escapeHtml(c.id)}">${escapeHtml(c.name)}</button>`).join("")}
    </div>
  `;
  document.getElementById("randomBtn").onclick=()=>{currentQuestionId=null;renderRandom();};
  document.getElementById("heartBtn").onclick=()=>toggleFavorite(chosen.id);
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>categoryRandom(b.dataset.cat));
}
function categoryRandom(catId){
  const pool=catId==="all"?questions:questions.filter(q=>q.categoryId===catId);
  const q=randomFrom(pool);
  if(!q){toast("이 카테고리에는 질문이 없습니다.");return}
  currentQuestionId=q.id;
  renderRandom();
}
function toggleFavorite(id){
  if(favorites.has(id)){favorites.delete(id);toast("즐겨찾기에서 뺐어요.");}
  else{favorites.add(id);toast("즐겨찾기에 저장했어요.");}
  save();updateNav();renderRandom();
}
function renderCategories(){
  document.getElementById("view").innerHTML=`
    <div class="hero"><div class="eyebrow">Categories</div><h1>카테고리</h1><p class="intro">카테고리 질문 뽑기</p></div>
    <div class="category-grid">
      ${categories.map(c=>{
        const count=questions.filter(q=>q.categoryId===c.id).length;
        return `<button class="cat-card" data-cat="${escapeHtml(c.id)}"><strong>${escapeHtml(c.name)}</strong><span>${count}개의 질문</span></button>`;
      }).join("")}
    </div>
  `;
  document.querySelectorAll(".cat-card").forEach(b=>b.onclick=()=>categoryRandom(b.dataset.cat));
}
function renderFavorites(){
  const list=questions.filter(q=>favorites.has(q.id));
  document.getElementById("view").innerHTML=`
    <div class="hero"><div class="eyebrow">Favorites</div><h1>즐겨찾기</h1><p class="intro">즐겨찾기 내 질문 뽑기</p></div>
    <div class="toolbar">
      <button class="primary" id="favRoulette">♥ 즐겨찾기에서 랜덤</button>
    </div>
    <div class="list">
      ${list.length?list.map(q=>`<div class="item">
        <div class="item-main"><div class="item-cat">${escapeHtml(catName(q.categoryId))}</div><div class="item-text">${escapeHtml(q.text)}</div></div>
        <div class="item-actions"><button class="icon-btn" data-remove="${q.id}">♥</button></div>
      </div>`).join(""):`<div class="panel empty">아직 저장한 질문이 없습니다.<br>질문 카드의 ♡를 눌러 저장해보세요.</div>`}
    </div>
  `;
  const rb=document.getElementById("favRoulette");
  rb.onclick=()=>{
    const q=randomFrom(list);
    if(!q){toast("즐겨찾기 질문이 없습니다.");return}
    currentQuestionId=q.id;setView("random");
  };
  document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>toggleFavorite(b.dataset.remove));
}
function renderManage(){
  document.getElementById("view").innerHTML=`
    <div class="hero"><div class="eyebrow">Database</div><h1>질문 관리</h1><p class="intro">질문과 카테고리는 여기서 자유롭게 추가하고 고칠 수 있어요.</p></div>
    <div class="panel">
      <div class="panel-title">새 질문 추가</div>
      <div class="form-grid">
        <div><label>카테고리</label><select id="qCat">${categories.map(c=>`<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join("")}</select></div>
        <div><label>질문</label><textarea id="qText" placeholder="생각할 거리를 입력하세요."></textarea></div>

      </div>

      <div class="list" style="margin-top:12px">
        ${categories.map(c=>`<div class="item"><div class="item-main"><div class="item-text">${escapeHtml(c.name)} <span class="small">· ${questions.filter(q=>q.categoryId===c.id).length}개</span></div></div><div class="item-actions"><button class="icon-btn" data-rename="${escapeHtml(c.id)}">수정</button>${categories.length>1?`<button class="icon-btn" data-delcat="${escapeHtml(c.id)}">삭제</button>`:""}</div></div>`).join("")}
      </div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="panel-title">질문 목록 <span class="small">(${questions.length}개)</span></div>
      <div class="list">
        ${questions.map(q=>`<div class="item">
          <div class="item-main"><div class="item-cat">${escapeHtml(catName(q.categoryId))}</div><div class="item-text">${escapeHtml(q.text)}</div></div>
          <div class="item-actions"><button class="icon-btn" data-edit="${q.id}">수정</button><button class="icon-btn" data-del="${q.id}">삭제</button></div>
        </div>`).join("")}
      </div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="panel-title">데이터 백업</div>
      <p class="intro" style="margin-bottom:14px">수정·추가한 질문, 카테고리, 즐겨찾기를 JSON 파일 하나로 다른 기기에 옮길 수 있어요.</p>
      <div class="toolbar" style="margin:0">
        <button class="primary" id="exportBackup">↓ 백업 내보내기</button>
        <button class="secondary" id="importBackupBtn">↑ 백업 가져오기</button>
        <input type="file" id="importBackupFile" accept="application/json,.json" class="hidden">
      </div>
    </div>
  `;
  document.getElementById("exportBackup").onclick=exportBackup;
  document.getElementById("importBackupBtn").onclick=()=>document.getElementById("importBackupFile").click();
  document.getElementById("importBackupFile").onchange=importBackup;

  document.getElementById("addQ").onclick=()=>{
    const text=document.getElementById("qText").value.trim(), categoryId=document.getElementById("qCat").value;
    if(!text){toast("질문을 입력해 주세요.");return}
    const id="q"+Date.now().toString(36);
    questions.push({id,categoryId,text});save();toast("질문을 추가했어요.");renderManage();
  };
  document.getElementById("addCat").onclick=()=>{
    const name=document.getElementById("newCat").value.trim();
    if(!name){toast("카테고리 이름을 입력해 주세요.");return}
    const id="c"+Date.now().toString(36);
    categories.push({id,name});save();toast("카테고리를 추가했어요.");renderManage();
  };
  document.querySelectorAll("[data-rename]").forEach(b=>b.onclick=()=>{
    const c=categories.find(x=>x.id===b.dataset.rename);if(!c)return;
    const name=prompt("새 카테고리 이름",c.name);
    if(name&&name.trim()){c.name=name.trim();save();renderManage();}
  });
  document.querySelectorAll("[data-delcat]").forEach(b=>b.onclick=()=>{
    const c=categories.find(x=>x.id===b.dataset.delcat);if(!c)return;
    const count=questions.filter(q=>q.categoryId===c.id).length;
    if(!confirm(`"${c.name}" 카테고리를 삭제할까요?\n이 카테고리의 질문 ${count}개도 함께 삭제됩니다.`))return;
    const ids=new Set(questions.filter(q=>q.categoryId===c.id).map(q=>q.id));
    questions=questions.filter(q=>q.categoryId!==c.id);
    ids.forEach(id=>favorites.delete(id));
    categories=categories.filter(x=>x.id!==c.id);save();renderManage();
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const q=questions.find(x=>x.id===b.dataset.del);if(!q)return;
    if(confirm("이 질문을 삭제할까요?")){
      questions=questions.filter(x=>x.id!==q.id);favorites.delete(q.id);save();renderManage();
    }
  });
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const q=questions.find(x=>x.id===b.dataset.edit);if(!q)return;
    const next=prompt("질문 수정",q.text);
    if(next!==null && next.trim()){q.text=next.trim();save();renderManage();}
  });
}
function exportBackup(){
  const data={
    app:"Q&A",
    version:1,
    exportedAt:new Date().toISOString(),
    categories,
    questions,
    favorites:[...favorites]
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  const d=new Date(), stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  a.href=url;a.download=`qa-backup-${stamp}.json`;a.click();URL.revokeObjectURL(url);
  toast("백업 파일을 만들었어요.");
}

function importBackup(e){
  const file=e.target.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data.categories)||!Array.isArray(data.questions)||!Array.isArray(data.favorites)) throw new Error();
      if(!confirm("현재 질문·카테고리·즐겨찾기를 백업 파일 내용으로 교체할까요?"))return;
      categories=data.categories;questions=data.questions;favorites=new Set(data.favorites);currentQuestionId=null;
      save();toast("백업을 가져왔어요.");setView("manage");
    }catch(err){alert("올바른 Q&A 백업 JSON 파일이 아닙니다.");}
    e.target.value="";
  };
  reader.readAsText(file,"utf-8");
}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.querySelectorAll("[data-mobile-view]").forEach(b=>b.onclick=()=>setView(b.dataset.mobileView));
setView("random");
</script>
